name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish as a GitHub release, e.g. 0.1.0 (empty = build only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            NAME="${INPUT_VERSION#v}"
            echo "RELEASE_TAG=v$NAME" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            NAME="${GITHUB_REF_NAME#v}"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::Cannot publish $RELEASE_TAG: SIGNING_KEYSTORE_BASE64 secret is not set."
            exit 1
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set. Release is signed with a debug key (not Play-ready)."
            echo "SIGNED_WITH=debug key (not Play-ready)" >> "$GITHUB_ENV"
          fi

      - name: Test and build release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect outputs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/*.apk "dist/MicroMind-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/MicroMind-${VERSION_NAME}.aab"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: micromind-release-${{ env.VERSION_NAME }}
          path: dist/*

      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: MicroMind ${{ env.VERSION_NAME }}
          files: dist/*
          body: |
            MicroMind ${{ env.VERSION_NAME }}: 10-second brain challenges.

            - `MicroMind-${{ env.VERSION_NAME }}.apk`: install directly on Android 8.0+ (allow "Install unknown apps").
            - `MicroMind-${{ env.VERSION_NAME }}.aab`: bundle for Google Play upload.

            Signed with: ${{ env.SIGNED_WITH }}.
